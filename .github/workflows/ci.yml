name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["22", "24"]
    defaults:
      run:
        working-directory: final_project
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: final_project/package-lock.json
      # Install exactly the locked versions, without running any package install scripts
      - run: npm ci --ignore-scripts
      - run: npm test
